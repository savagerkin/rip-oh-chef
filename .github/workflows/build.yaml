name: Build Game

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: RipOhChef
  PROJECT_PATH: .

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            file: "RipOhChef.exe"

          - platform: mac
            preset: "macOS"
            file: "RipOhChef.zip"

          - platform: linux
            preset: "Linux"
            file: "RipOhChef.x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/

          cp -r /root/.config/godot ~/.config/ || true

          TEMPLATE_DIR=$(find /root/.local/share/godot/export_templates \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -1)

          echo "Using templates from: $TEMPLATE_DIR"

          cp -r "$TEMPLATE_DIR" ~/.local/share/godot/export_templates/

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -v -p build/${{ matrix.platform }}

          EXPORT_DIR="$(readlink -f build)"
          OUTPUT="$EXPORT_DIR/${{ matrix.platform }}/${{ matrix.file }}"

          godot --version

          godot --headless --verbose \
            --path "$PROJECT_PATH" \
            --import

          godot --headless --verbose \
            --path "$PROJECT_PATH" \
            --export-release "${{ matrix.preset }}" \
            "$OUTPUT"

          test -s "$OUTPUT"

          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.platform }}" = "linux" ]; then
            test -s "${OUTPUT%.*}.pck"
          fi

          ls -lah "$EXPORT_DIR/${{ matrix.platform }}"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: RipOhChef-${{ matrix.platform }}
          path: build/${{ matrix.platform }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Show Builds
        run: |
          find builds -type f

      - name: Package Windows Build
        run: |
          cd builds/RipOhChef-windows
          zip -r ../../RipOhChef-Windows.zip .

      - name: Rename Mac Build
        run: |
          cp builds/RipOhChef-mac/RipOhChef.zip RipOhChef-macOS.zip

      - name: Package Linux Build
        run: |
          chmod +x builds/RipOhChef-linux/RipOhChef.x86_64
          tar -czf RipOhChef-Linux.tar.gz \
            -C builds/RipOhChef-linux .

      - name: Delete Oldest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAG=$(gh release list \
            --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | .[0].tagName // empty')

          if [ -n "$OLD_TAG" ]; then
            echo "Deleting oldest release: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes
          else
            echo "No previous release found."
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          echo "Creating release: $TAG"

          gh release create "$TAG" \
            RipOhChef-Windows.zip \
            RipOhChef-macOS.zip \
            RipOhChef-Linux.tar.gz \
            --target "${GITHUB_SHA}" \
            --title "Rip Oh Chef $TAG" \
            --generate-notes \
            --latest