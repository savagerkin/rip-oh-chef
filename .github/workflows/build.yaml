name: Build Game

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: RipOhChef
  PROJECT_PATH: .

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            file: "RipOhChef.exe"

          - platform: mac
            preset: "macOS"
            file: "RipOhChef.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/

          cp -r /root/.config/godot ~/.config/ || true

          TEMPLATE_DIR=$(find /root/.local/share/godot/export_templates \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | head -1)

          echo "Using templates from: $TEMPLATE_DIR"

          cp -r "$TEMPLATE_DIR" ~/.local/share/godot/export_templates/

      - name: Build
        run: |
          mkdir -v -p build/${{ matrix.platform }}

          EXPORT_DIR="$(readlink -f build)"
          OUTPUT="$EXPORT_DIR/${{ matrix.platform }}/${{ matrix.file }}"

          echo "Building ${{ matrix.preset }}"
          echo "Output: $OUTPUT"

          # Godot 4.7.2 can crash during shutdown in headless CI
          # even after successfully creating the export.
          godot --headless --verbose \
            --export-release "${{ matrix.preset }}" \
            "$OUTPUT" || true

          echo ""
          echo "Checking build output..."

          ls -lah "$EXPORT_DIR/${{ matrix.platform }}" || true

          if [ ! -e "$OUTPUT" ]; then
            echo "ERROR: Export was not created:"
            echo "$OUTPUT"
            exit 1
          fi

          echo "Build successfully created:"
          echo "$OUTPUT"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: RipOhChef-${{ matrix.platform }}
          path: build/${{ matrix.platform }}
          if-no-files-found: error


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Show Builds
        run: |
          find builds -type f

      - name: Package Windows Build
        run: |
          cd builds/RipOhChef-windows
          zip -r ../../RipOhChef-Windows.zip .

      - name: Rename Mac Build
        run: |
          cp builds/RipOhChef-mac/RipOhChef.zip RipOhChef-macOS.zip

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            RipOhChef-Windows.zip \
            RipOhChef-macOS.zip \
            --title "Rip Oh Chef ${{ inputs.version }}" \
            --generate-notes